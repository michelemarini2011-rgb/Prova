<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Martello &amp; Scatole</title>
<meta name="description" content="Un nano con il martello stordisce gli spiritelli e li inscatola. Schermo fisso, grafica generata proceduralmente.">
<meta name="theme-color" content="#191320">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading">
  <p>Il sole è alto sulla cava…</p>
  <div class="bar"><div id="loading-bar"></div></div>
</div>

<main class="stage">
  <div class="screen">
    <canvas id="game" width="960" height="540" aria-label="Area di gioco di Martello e Scatole"></canvas>
  </div>

  <div class="pad" aria-hidden="true">
    <div class="dpad">
      <button class="left" data-btn="left" type="button">◀</button>
      <button class="right" data-btn="right" type="button">▶</button>
      <button class="down" data-btn="down" type="button">▼</button>
    </div>
    <div class="acts">
      <button class="jump" data-btn="jump" type="button">salta</button>
      <button class="smash" data-btn="action" type="button">martella</button>
    </div>
  </div>

  <div class="controls">
    <button id="btn-pause" type="button">⏸ pausa</button>
    <button id="btn-restart" type="button">↺ stanza</button>
    <button id="btn-sound" type="button" aria-pressed="true">♪ audio</button>
  </div>

  <p class="hint">
    <kbd>←</kbd><kbd>→</kbd> corri · <kbd>spazio</kbd> salta · <kbd>X</kbd> martella ·
    <kbd>↓</kbd>+<kbd>spazio</kbd> scendi dalle assi · <kbd>P</kbd> pausa ·
    <kbd>R</kbd> ricomincia la cava · <kbd>M</kbd> audio
  </p>
</main>

<script src="js/arenas.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/arena.js"></script>
<script src="js/platforms.js"></script>
<script src="js/dwarf.js"></script>
<script src="js/imps.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
